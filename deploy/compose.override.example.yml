# Copy to compose.override.yml (gitignored) to adapt the stack to your host.
# Compose merges it over docker-compose.yml automatically:
#
#   docker compose -f docker-compose.yml -f compose.override.yml up -d
#
# The base compose keeps everything on an internal network with no published
# ports, which is the safe default. Opening things up is a per-deployment
# decision and belongs here, not in a tracked file.

services:
  # ── Reaching Actual's UI from other devices ───────────────────────────
  #
  # Publishing requires a routable network. Docker SILENTLY ignores `ports:`
  # on an internal-only network -- it accepts the directive and creates no
  # mapping, with no warning -- so the service must also join `default`.
  #
  # The cost is that actual gains internet egress, which it does not have in
  # the base configuration. Accept that knowingly.
  #
  # Bind 0.0.0.0 rather than a literal address unless your host has a static
  # IP. On DHCP, a literal address here breaks the stack at the next lease.
  #
  # WARNING: this is plaintext HTTP carrying financial data. Anything on the
  # network can read it in transit and reach the login page. Prefer putting a
  # reverse proxy with a certificate on dashboard_back and publishing that
  # instead of this block.
  actual:
    ports:
      - "0.0.0.0:5006:5006"
    networks:
      - default
      - dashboard_back

  # ── Do NOT do the same for actual-api ─────────────────────────────────
  # Only n8n and the dashboard ever call it, and both are on dashboard_back.
  # Publishing it would widen the attack surface for no benefit -- and note
  # that GET /v1/budgets is unauthenticated upstream regardless of the API
  # key, so an exposed wrapper leaks budget names and sync ids to anyone.

  # ── The dashboard itself ──────────────────────────────────────────────
  # Same trade-off, higher stakes: this one holds mail and calendar as well.
  # It has real session auth, but still no TLS on its own. Publish it only
  # behind a proxy that terminates HTTPS.
  #
  # dashboard:
  #   ports:
  #     - "0.0.0.0:8766:8766"
