name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# No job needs write access. Least privilege by default.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: leak & XSS guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret removed in the tip commit is still public
          # in the history, so the scan has to see all of it.
          fetch-depth: 0

      - name: gitleaks — secrets in history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: no host-specific strings
        run: ./scripts/check-no-infra-strings.sh

      - name: no markup sinks in front-end
        run: ./scripts/check-no-innerhtml.sh

      - name: front-end modules parse
        # No build step means a syntax error is not found until a browser
        # silently renders nothing, with no trace anywhere the server sees.
        run: ./scripts/check-js-syntax.sh

      - name: nothing sensitive is tracked
        run: |
          # A .gitignore rule only helps if it was already there when the file
          # was added. This catches the case where it wasn't.
          fail=0
          if git ls-files | grep -E '(^|/)\.env$|\.(db|sqlite3?|key|pem|ofx|qfx)$'; then
            echo "BLOCKED — a sensitive file type is tracked"; fail=1
          fi
          if git ls-files deploy/secrets | grep -v -x 'deploy/secrets/.gitkeep' | grep .; then
            echo "BLOCKED — a real secret file is tracked"; fail=1
          fi
          [ "$fail" -eq 0 ] && echo "clean — no sensitive files tracked"
          exit "$fail"

  python:
    name: lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install dev tooling
        run: python -m pip install --upgrade pip ruff pytest

      - name: ruff
        run: ruff check app tests scripts 2>/dev/null || ruff check app tests

      - name: pytest
        run: |
          if [ -d tests ] && ls tests/test_*.py >/dev/null 2>&1; then
            PYTHONPATH=app/src python -m pytest tests -q
          else
            echo "no tests yet"
          fi

      - name: runtime imports must not need third-party packages
        run: |
          # The app runs on the standard library plus one pinned dependency.
          # This asserts nothing else crept in.
          PYTHONPATH=app/src python - <<'PY'
          import pathlib, re, sys
          allowed = {"cryptography"}
          bad = []
          for p in pathlib.Path("app/src").rglob("*.py"):
              for i, line in enumerate(p.read_text().splitlines(), 1):
                  m = re.match(r'\s*(?:import|from)\s+([A-Za-z_][\w.]*)', line)
                  if not m:
                      continue
                  top = m.group(1).split(".")[0]
                  if top in sys.stdlib_module_names or top in allowed:
                      continue
                  if top in {"dashboard"} or (p.parent / f"{top}.py").exists():
                      continue
                  bad.append(f"{p}:{i}: {line.strip()}")
          if bad:
              print("BLOCKED — unexpected third-party import:")
              print("\n".join("    " + b for b in bad))
              raise SystemExit(1)
          print("clean — stdlib plus", ", ".join(sorted(allowed)))
          PY

  docker:
    name: dockerfile lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hadolint
        run: |
          if [ -f app/Dockerfile ]; then
            docker run --rm -i hadolint/hadolint < app/Dockerfile
          else
            echo "no Dockerfile yet"
          fi
