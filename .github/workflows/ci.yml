name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# No job needs write access. Least privilege by default.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: leak & XSS guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret removed in the tip commit is still public
          # in the history, so the scan has to see all of it.
          fetch-depth: 0

      - name: gitleaks — secrets in history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: no host-specific strings
        run: ./scripts/check-no-infra-strings.sh

      - name: no markup sinks in front-end
        run: ./scripts/check-no-innerhtml.sh

      - name: documented env vars still exist
        run: ./scripts/check-env-documented.sh

      - name: API reference matches the routing table
        run: ./scripts/gen-api-doc.py --check

      - name: front-end modules parse
        # No build step means a syntax error is not found until a browser
        # silently renders nothing, with no trace anywhere the server sees.
        run: ./scripts/check-js-syntax.sh

      - name: front-end behaviour
        # Parsing is not correctness. These run in a zone that is not UTC on
        # purpose: reading a naive UTC timestamp as local gives the identical
        # answer in UTC, so a suite that runs there cannot see the bug.
        run: ./scripts/check-js-behaviour.sh

      - name: nothing used before it is declared
        # const is not hoisted, so this throws at runtime while the file
        # still parses -- check-js-syntax cannot see it.
        run: ./scripts/check-js-declared-first.sh

      - name: nothing personal or financial is tracked
        run: ./scripts/check-no-personal-data.sh

  python:
    name: lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install dev tooling
        run: python -m pip install --upgrade pip ruff pytest

      - name: install the runtime dependency
        # The app is the standard library plus cryptography, and the tests
        # exercise the code that uses it: storing a Google refresh token
        # encrypts it, and crypt.encrypt refuses rather than falling back to
        # plaintext. Without this the suite does not fail in ones and twos --
        # 78 tests error before it reaches the end of the third module.
        run: python -m pip install -r requirements.txt

      - name: ruff
        run: ruff check app tests scripts 2>/dev/null || ruff check app tests

      - name: pytest
        run: |
          if [ -d tests ] && ls tests/test_*.py >/dev/null 2>&1; then
            PYTHONPATH=app/src python -m pytest tests -q
          else
            echo "no tests yet"
          fi

      - name: runtime imports must not need third-party packages
        run: |
          # The app runs on the standard library plus one pinned dependency.
          # This asserts nothing else crept in.
          PYTHONPATH=app/src python - <<'PY'
          import pathlib, re, sys
          allowed = {"cryptography"}
          bad = []
          for p in pathlib.Path("app/src").rglob("*.py"):
              for i, line in enumerate(p.read_text().splitlines(), 1):
                  m = re.match(r'\s*(?:import|from)\s+([A-Za-z_][\w.]*)', line)
                  if not m:
                      continue
                  top = m.group(1).split(".")[0]
                  if top in sys.stdlib_module_names or top in allowed:
                      continue
                  if top in {"dashboard"} or (p.parent / f"{top}.py").exists():
                      continue
                  bad.append(f"{p}:{i}: {line.strip()}")
          if bad:
              print("BLOCKED — unexpected third-party import:")
              print("\n".join("    " + b for b in bad))
              raise SystemExit(1)
          print("clean — stdlib plus", ", ".join(sorted(allowed)))
          PY

  manifests:
    name: dependency manifests agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the two requirements files must not drift
        run: |
          # install.sh installs app/requirements.txt; the documented manual
          # install uses the root one. Two files, one dependency set: if they
          # disagree, some installs get a different version of the library
          # that decrypts the tokens.
          a=$(grep -vE '^\s*(#|$)' requirements.txt | sort)
          b=$(grep -vE '^\s*(#|$)' app/requirements.txt | sort)
          if [ "$a" != "$b" ]; then
            echo "BLOCKED — requirements.txt and app/requirements.txt disagree:"
            diff <(echo "$a") <(echo "$b") || true
            exit 1
          fi
          echo "clean — both pin: $a"
