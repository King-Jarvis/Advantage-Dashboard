version: 2
updates:
  # The runtime has a single pinned dependency and the rest is stdlib, so the
  # meaningful supply-chain surface is CI actions and base images.
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }

  # Both manifests, because install.sh reads app/requirements.txt while the
  # documented manual install reads the one at the root. Watching only one
  # would leave the other pinned to a version nobody is checking.
  - package-ecosystem: pip
    directory: "/"
    schedule: { interval: weekly }

  - package-ecosystem: pip
    directory: "/app"
    schedule: { interval: weekly }
